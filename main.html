<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <meta name="author" content="Pranav Joshi" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="nav-bar flex">
        <div class="logo">
          <article>
            <img src="images/logo.png" alt="logo" />
            <h2>Shopping Hub</h2>
          </article>
        </div>
        <div class="choices flex">
          <nav>
            <a href="main.html"
              ><button><span>Home</span></button></a
            >
          </nav>
          <nav>
            <a href="main.html"
              ><button><span>Products</span></button></a
            >
          </nav>
          <nav>
            <a href="cart.html"
              ><button><span>Cart</span></button></a
            >
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="home-window flex">
        <div class="side-bar flex">
          <nav>
            <a href="main.html"
              ><button><span>Home</span></button></a
            >
          </nav>
          <nav>
            <a href="main.html"
              ><button><span>Products</span></button></a
            >
          </nav>
          <nav>
            <a href="cart.html"
              ><button><span>Cart</span></button></a
            >
          </nav>
          <nav>
            <a href="main.html"
              ><button><span>Settings</span></button></a
            >
          </nav>
        </div>
        <div class="main-content r">
          <ul class="products">
            <li>
              <article class="item">
                <img src="images/unnamed.png" alt="Google Pixel 10" />
                <h2>Google Pixel 10</h2>
                <p>Price €12</p>
                <button class="add-to-cart">Add to cart</button>
              </article>
            </li>

            <li>
              <article class="item">
                <img src="images/images.jpg" alt="CMF Nothing Headphones" />
                <h2>CMF Nothing Headphones</h2>
                <p>Price €12</p>
                <button class="add-to-cart">Add to cart</button>
              </article>
            </li>

            <li>
              <article class="item">
                <img
                  src="images/mac-card-40-macbook-neo-202603_FMT_WHH.png"
                  alt="MacBook Neo"
                />
                <h2>Mac Neo</h2>
                <p>Price €12</p>
                <button class="add-to-cart">Add to cart</button>
              </article>
            </li>

            <li>
              <article class="item">
                <img
                  src="images/Strongest-Velo.webp"
                  alt="VELO Freezing Peppermint"
                />
                <h2>VELO Freezing Peppermint</h2>
                <p>Price €12</p>
                <button class="add-to-cart">Add to cart</button>
              </article>
            </li>

            <li>
              <article class="item">
                <img src="images/chair.jpg" alt="Wooden Dining Chair" />
                <h2>Wooden Dining Chair</h2>
                <p>Price €12</p>
                <button class="add-to-cart">Add to cart</button>
              </article>
            </li>

            <li>
              <article class="item">
                <img src="images/microwave.jpg" alt="Compact Microwave Oven" />
                <h2>Compact Microwave Oven</h2>
                <p>Price €12</p>
                <button class="add-to-cart">Add to cart</button>
              </article>
            </li>
          </ul>
          <article>
            <h1>Filters</h1>
            <label for="brand">Brand</label>
            <select id="brand">
              <option>Apple</option>
              <option>Samsung</option>
              <option>Sony</option>
            </select>
            <label for="price">Price</label>
            <select name="price" id="price">
              <option value="€<€20"><€20</option>
              <option value="€<€50"><€50</option>
              <option value="€<€100"><€100</option>
            </select>
          </article>
        </div>
      </section>
    </main>
    <footer>
      <h1>contact us</h1>
    </footer>
  </body>
</html>
